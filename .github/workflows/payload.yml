name: Wave payload contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run payload
        run: python3 payload.py
      - name: Offline regression tests
        run: python3 -m unittest discover -v
      - name: Check frozen local evidence lab bytes
        run: sha256sum --check lanes/l1/local_evidence_lab/SHA256SUMS
      - name: Offline local evidence lab tests
        working-directory: lanes/l1/local_evidence_lab
        run: python3 -B -m unittest -v test_evidence_lab test_selective_calibration test_source_alignment
      - name: Replay unsigned local inference observation with synthetic actions
        run: python3 -I -B lanes/l1/local_evidence_lab/evidence_lab.py --verify examples/local-evidence-admission-20260929/local-inference-receipt.json
      - name: Verify public estate evidence without promotion
        run: python3 tools/verify_estate_evidence.py
      - name: Verify historical source reconciliation without promotion
        run: python3 tools/reconcile_estate.py --root examples/estate-audit-20260924 --check
      - name: Verify historical model evidence without promotion
        run: python3 tools/verify_model_reconciliation.py --root examples/estate-audit-20260924
      - name: Estate operational selftest
        run: python3 szl_estate_operational.py --selftest
      - name: All-wave closer
        run: python3 -m compose.waves
      - name: Investor selftest
        run: python3 SZL_HF_FRONTIER_INVESTOR.py --selftest
