    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 4 * * 1'  # weekly, Monday 04:28 UTC
permissions:
  contents: read
jobs:
  analyze:
    # Org reusable workflow, SHA-pinned to the reviewed 2026-11-07 authority.
    uses: szl-holdings/.github/.github/workflows/reusable-codeql.yml@227869f48023ea2cc344458d45670e6dddc71897
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python"]'
